<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="symGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="30%" stop-color="#FFDF73" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#805A0C" />
    </linearGradient>
    <radialGradient id="symGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5A1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glowing Backdrop -->
  <circle cx="100" cy="100" r="90" fill="url(#symGlow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#symGold)" stroke-width="1.5" stroke-dasharray="3,4"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#symGold)" stroke-width="1"/>

  <!-- Sacred Kalash (Pot) -->
  <!-- Base Pedestal -->
  <path d="M 80,165 L 120,165 L 115,155 L 85,155 Z" fill="url(#symGold)" stroke="#805A0C" stroke-width="1"/>
  
  <!-- Kalash Pot Body -->
  <path d="M 75,130 C 65,150 78,155 100,155 C 122,155 135,150 125,130 C 130,115 120,105 100,105 C 80,105 70,115 75,130 Z" 
        fill="url(#symGold)" stroke="#805A0C" stroke-width="1.5"/>

  <!-- Sacred Swastika on Kalash -->
  <g transform="translate(100, 132) scale(0.65)" stroke="#B71C1C" stroke-width="3" stroke-linecap="square">
    <line x1="-15" y1="0" x2="15" y2="0"/>
    <line x1="0" y1="-15" x2="0" y2="15"/>
    <line x1="-15" y1="0" x2="-15" y2="-12"/>
    <line x1="15" y1="0" x2="15" y2="12"/>
    <line x1="0" y1="-15" x2="12" y2="-15"/>
    <line x1="0" y1="15" x2="-12" y2="15"/>
  </g>

  <!-- Mango Leaves (Amra Pallav) emerging from Kalash -->
  <!-- Center Leaf -->
  <path d="M 100,105 C 95,75 100,55 100,50 C 100,55 105,75 100,105 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="1"/>
  <!-- Left Leaf 1 -->
  <path d="M 92,105 C 80,80 70,65 65,65 C 72,80 85,95 92,105 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="1"/>
  <!-- Right Leaf 1 -->
  <path d="M 108,105 C 120,80 130,65 135,65 C 128,80 115,95 108,105 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="1"/>
  <!-- Left Leaf 2 -->
  <path d="M 85,108 C 65,95 50,85 45,90 C 58,100 75,106 85,108 Z" fill="#43A047" stroke="#1B5E20" stroke-width="0.8"/>
  <!-- Right Leaf 2 -->
  <path d="M 115,108 C 135,95 150,85 155,90 C 142,100 125,106 115,108 Z" fill="#43A047" stroke="#1B5E20" stroke-width="0.8"/>

  <!-- Coconut (Nariyal) sitting on leaves -->
  <ellipse cx="100" cy="72" rx="20" ry="24" fill="#795548" stroke="#4E342E" stroke-width="1.5"/>
  <!-- Coconut fibers/hair -->
  <path d="M 90,52 Q 100,38 110,52" fill="none" stroke="#4E342E" stroke-width="2"/>
  <path d="M 94,48 Q 100,34 106,48" fill="none" stroke="#5D4037" stroke-width="1.5"/>

  <!-- Red Chunri / Moli Thread around Coconut -->
  <path d="M 82,75 Q 100,85 118,75" fill="none" stroke="#D32F2F" stroke-width="3"/>
  <circle cx="100" cy="78" r="3" fill="url(#symGold)"/>

  <!-- Interlocking Wedding Bands / Sacred Knot at Top -->
  <g transform="translate(100, 32)">
    <circle cx="-12" cy="0" r="14" fill="none" stroke="url(#symGold)" stroke-width="3"/>
    <circle cx="12" cy="0" r="14" fill="none" stroke="url(#symGold)" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#E53935"/>
  </g>
</svg>
