<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F5D77F" />
    </linearGradient>
    <radialGradient id="mandalaCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5A1020" />
      <stop offset="80%" stop-color="#3B0915" />
      <stop offset="100%" stop-color="#1A0207" />
    </radialGradient>
  </defs>

  <g transform="translate(250, 250)">
    <!-- Central Circles -->
    <circle cx="0" cy="0" r="240" fill="none" stroke="url(#mandalaGold)" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="230" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="215" fill="none" stroke="url(#mandalaGold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="url(#mandalaGold)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#mandalaGold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#mandalaGold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="45" fill="url(#mandalaCenter)" stroke="url(#mandalaGold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="url(#mandalaGold)"/>
    <circle cx="0" cy="0" r="8" fill="#5A1020"/>

    <!-- 8 Main Outer Petals -->
    <g id="petalGroup" fill="rgba(212, 175, 55, 0.08)" stroke="url(#mandalaGold)" stroke-width="1.5">
      <path d="M 0,-215 C 45,-175 45,-130 0,-85 C -45,-130 -45,-175 0,-215 Z"/>
      <path d="M 0,-215 C 20,-180 20,-150 0,-130 C -20,-150 -20,-180 0,-215 Z" fill="rgba(212, 175, 55, 0.15)"/>
      <circle cx="0" cy="-215" r="4" fill="url(#mandalaGold)"/>
      <circle cx="0" cy="-170" r="3" fill="url(#mandalaGold)"/>
    </g>
    <use href="#petalGroup" transform="rotate(45)"/>
    <use href="#petalGroup" transform="rotate(90)"/>
    <use href="#petalGroup" transform="rotate(135)"/>
    <use href="#petalGroup" transform="rotate(180)"/>
    <use href="#petalGroup" transform="rotate(225)"/>
    <use href="#petalGroup" transform="rotate(270)"/>
    <use href="#petalGroup" transform="rotate(315)"/>

    <!-- 16 Mid Petals -->
    <g id="midPetal" stroke="url(#mandalaGold)" stroke-width="1.2" fill="none">
      <path d="M 0,-130 Q 25,-105 0,-85 Q -25,-105 0,-130 Z" fill="rgba(212, 175, 55, 0.1)"/>
      <circle cx="0" cy="-105" r="2" fill="url(#mandalaGold)"/>
    </g>
    <use href="#midPetal" transform="rotate(22.5)"/>
    <use href="#midPetal" transform="rotate(67.5)"/>
    <use href="#midPetal" transform="rotate(112.5)"/>
    <use href="#midPetal" transform="rotate(157.5)"/>
    <use href="#midPetal" transform="rotate(202.5)"/>
    <use href="#midPetal" transform="rotate(247.5)"/>
    <use href="#midPetal" transform="rotate(292.5)"/>
    <use href="#midPetal" transform="rotate(337.5)"/>

    <!-- Outer Decorative Crests -->
    <g id="crest" stroke="url(#mandalaGold)" stroke-width="1.2" fill="none">
      <path d="M -20,-215 Q 0,-245 20,-215"/>
      <circle cx="0" cy="-235" r="3" fill="url(#mandalaGold)"/>
    </g>
    <use href="#crest" transform="rotate(22.5)"/>
    <use href="#crest" transform="rotate(45)"/>
    <use href="#crest" transform="rotate(67.5)"/>
    <use href="#crest" transform="rotate(90)"/>
    <use href="#crest" transform="rotate(112.5)"/>
    <use href="#crest" transform="rotate(135)"/>
    <use href="#crest" transform="rotate(157.5)"/>
    <use href="#crest" transform="rotate(180)"/>
    <use href="#crest" transform="rotate(202.5)"/>
    <use href="#crest" transform="rotate(225)"/>
    <use href="#crest" transform="rotate(247.5)"/>
    <use href="#crest" transform="rotate(270)"/>
    <use href="#crest" transform="rotate(292.5)"/>
    <use href="#crest" transform="rotate(315)"/>
    <use href="#crest" transform="rotate(337.5)"/>
    <use href="#crest" transform="rotate(360)"/>
  </g>
</svg>
