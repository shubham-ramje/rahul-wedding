<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="baraatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="25%" stop-color="#FFDF73" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="royalRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="20%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Ground Line / Golden Floral Track -->
  <line x1="20" y1="285" x2="880" y2="285" stroke="url(#groundGrad)" stroke-width="2.5"/>
  <line x1="50" y1="290" x2="850" y2="290" stroke="url(#groundGrad)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Left Side: Shehnai & Dholak Musicians in Procession -->
  <!-- Shehnai Player 1 -->
  <g transform="translate(70, 160)">
    <!-- Turban -->
    <path d="M 18,20 C 10,12 35,5 42,18 C 45,26 30,30 20,28 Z" fill="#E53935"/>
    <circle cx="28" cy="18" r="3" fill="url(#baraatGold)"/>
    <!-- Head -->
    <circle cx="25" cy="30" r="10" fill="url(#baraatGold)"/>
    <!-- Body / Kurta -->
    <path d="M 15,40 L 35,40 L 40,90 L 10,90 Z" fill="url(#baraatGold)"/>
    <!-- Legs -->
    <line x1="18" y1="90" x2="16" y2="125" stroke="url(#baraatGold)" stroke-width="4"/>
    <line x1="32" y1="90" x2="35" y2="125" stroke="url(#baraatGold)" stroke-width="4"/>
    <!-- Arms holding Shehnai -->
    <path d="M 20,45 L 45,48 L 75,30" stroke="url(#baraatGold)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Shehnai Instrument -->
    <path d="M 28,34 L 75,25 L 88,18 L 88,32 L 75,25" fill="url(#baraatGold)" stroke="#805A0C" stroke-width="1"/>
    <!-- Musical notes floating -->
    <text x="95" y="15" fill="url(#baraatGold)" font-size="14">♪</text>
    <text x="108" y="25" fill="url(#baraatGold)" font-size="11">♫</text>
  </g>

  <!-- Dholak Player -->
  <g transform="translate(180, 160)">
    <!-- Turban -->
    <path d="M 18,18 C 10,10 38,5 42,16 C 45,24 30,28 20,26 Z" fill="#E53935"/>
    <!-- Head -->
    <circle cx="26" cy="28" r="10" fill="url(#baraatGold)"/>
    <!-- Body -->
    <path d="M 15,38 L 37,38 L 42,88 L 10,88 Z" fill="url(#baraatGold)"/>
    <!-- Legs -->
    <line x1="18" y1="88" x2="15" y2="125" stroke="url(#baraatGold)" stroke-width="4"/>
    <line x1="34" y1="88" x2="38" y2="125" stroke="url(#baraatGold)" stroke-width="4"/>
    <!-- Dhol Barrel -->
    <ellipse cx="28" cy="62" rx="26" ry="15" fill="#8D6E63" stroke="url(#baraatGold)" stroke-width="2"/>
    <ellipse cx="6" cy="62" rx="5" ry="13" fill="#D7CCC8" stroke="url(#baraatGold)" stroke-width="1.5"/>
    <ellipse cx="50" cy="62" rx="5" ry="13" fill="#D7CCC8" stroke="url(#baraatGold)" stroke-width="1.5"/>
    <!-- Dhol Strap -->
    <path d="M 20,40 L 28,62" stroke="#E53935" stroke-width="2"/>
    <!-- Drumsticks / Hands -->
    <line x1="38" y1="46" x2="52" y2="58" stroke="url(#baraatGold)" stroke-width="3"/>
  </g>

  <!-- Centerpiece: Royal Decorated Elephant with Golden Howdah / Ambari -->
  <g transform="translate(320, 45)">
    <!-- Royal Umbrella (Chhatra) atop Howdah -->
    <path d="M 180,45 C 130,45 130,15 180,5 C 230,15 230,45 180,45 Z" fill="url(#royalRed)" stroke="url(#baraatGold)" stroke-width="2"/>
    <line x1="180" y1="5" x2="180" y2="70" stroke="url(#baraatGold)" stroke-width="3"/>
    <!-- Kalash Finial atop umbrella -->
    <circle cx="180" cy="3" r="4" fill="url(#baraatGold)"/>
    <!-- Umbrella fringes -->
    <path d="M 135,45 Q 145,52 155,45 Q 165,52 175,45 Q 185,52 195,45 Q 205,52 215,45 Q 225,52 230,45" fill="none" stroke="url(#baraatGold)" stroke-width="1.5"/>

    <!-- Howdah / Pavilion -->
    <rect x="145" y="65" width="70" height="42" rx="5" fill="url(#baraatGold)" stroke="#805A0C" stroke-width="2"/>
    <path d="M 145,85 L 215,85" stroke="#5A1020" stroke-width="2"/>
    <circle cx="180" cy="75" r="5" fill="#C2185B"/>

    <!-- Elephant Body -->
    <!-- Torso -->
    <ellipse cx="180" cy="180" rx="90" ry="65" fill="url(#baraatGold)"/>
    <!-- Head -->
    <circle cx="95" cy="140" r="48" fill="url(#baraatGold)"/>
    <!-- Trunk (curved high in royal salute) -->
    <path d="M 60,155 C 25,175 10,130 25,100 C 35,80 50,90 45,105 C 40,118 35,135 65,130 Z" fill="url(#baraatGold)" stroke="#805A0C" stroke-width="1.5"/>
    <circle cx="36" cy="92" r="5" fill="#FFD54F"/>
    
    <!-- Tusk -->
    <path d="M 68,162 C 45,168 35,155 30,150 C 45,155 60,158 68,162 Z" fill="#FFFDF7" stroke="#AA771C" stroke-width="1"/>
    
    <!-- Large Royal Ear -->
    <path d="M 115,115 C 150,115 155,165 130,185 C 110,195 100,165 110,140 Z" fill="#E8D5A3" stroke="#805A0C" stroke-width="2"/>
    <!-- Golden Ear Ornament (Karnaphool) -->
    <circle cx="130" cy="155" r="5" fill="#E53935" stroke="url(#baraatGold)" stroke-width="1.5"/>

    <!-- Head Net (Jhool & Matha Patti) -->
    <path d="M 85,100 C 65,115 65,145 80,155" stroke="#E53935" stroke-width="4" fill="none"/>
    <circle cx="85" cy="125" r="4" fill="#FFE082"/>

    <!-- Royal Velvet Blanket (Jhool) on Back -->
    <path d="M 115,145 C 150,135 210,135 245,145 L 240,215 C 205,230 155,230 120,215 Z" fill="url(#royalRed)" stroke="url(#baraatGold)" stroke-width="2.5"/>
    <!-- Jhool Gold Embroideries -->
    <circle cx="180" cy="180" r="18" fill="none" stroke="url(#baraatGold)" stroke-width="2"/>
    <circle cx="180" cy="180" r="8" fill="url(#baraatGold)"/>
    <path d="M 125,212 Q 180,225 235,212" stroke="url(#baraatGold)" stroke-width="3" stroke-dasharray="4,3" fill="none"/>

    <!-- Legs -->
    <!-- Front Left -->
    <rect x="85" y="185" width="28" height="55" rx="10" fill="url(#baraatGold)"/>
    <!-- Front Right -->
    <rect x="120" y="195" width="26" height="45" rx="10" fill="#B38728"/>
    <!-- Back Left -->
    <rect x="210" y="195" width="28" height="45" rx="10" fill="#B38728"/>
    <!-- Back Right -->
    <rect x="235" y="185" width="28" height="55" rx="10" fill="url(#baraatGold)"/>
    
    <!-- Golden Anklets (Payal) -->
    <rect x="85" y="230" width="28" height="6" fill="#FFF3C4" stroke="#805A0C" stroke-width="0.8"/>
    <rect x="235" y="230" width="28" height="6" fill="#FFF3C4" stroke="#805A0C" stroke-width="0.8"/>

    <!-- Tail -->
    <path d="M 265,170 Q 285,195 280,225" stroke="url(#baraatGold)" stroke-width="3" fill="none"/>
    <ellipse cx="280" cy="225" rx="4" ry="7" fill="#805A0C"/>
  </g>

  <!-- Right Side: The Royal Horse (Ghodi) Decorated for the Groom -->
  <g transform="translate(640, 110)">
    <!-- Chhatra / Royal Parasol -->
    <path d="M 90,20 C 55,20 55,2 90,-5 C 125,2 125,20 90,20 Z" fill="url(#royalRed)" stroke="url(#baraatGold)" stroke-width="1.5"/>
    <line x1="90" y1="-5" x2="90" y2="45" stroke="url(#baraatGold)" stroke-width="2"/>

    <!-- Horse Mane & Head -->
    <path d="M 30,55 C 20,40 35,25 45,30 C 55,35 60,50 65,70 C 80,75 110,75 125,95 L 140,115 C 110,115 90,105 75,90 L 55,85 C 45,85 30,75 30,55 Z" fill="url(#baraatGold)" stroke="#805A0C" stroke-width="1.5"/>
    <!-- Horse Plume (Kalgi) -->
    <path d="M 42,26 C 45,10 55,5 50,22 Z" fill="#E53935"/>

    <!-- Royal Saddle & Decorated Jhool -->
    <ellipse cx="115" cy="115" rx="45" ry="25" fill="url(#royalRed)" stroke="url(#baraatGold)" stroke-width="2"/>
    <circle cx="115" cy="115" r="8" fill="url(#baraatGold)"/>

    <!-- Horse Body & Legs -->
    <ellipse cx="110" cy="118" rx="52" ry="30" fill="url(#baraatGold)"/>
    <!-- Legs -->
    <line x1="75" y1="135" x2="70" y2="175" stroke="url(#baraatGold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="135" x2="88" y2="175" stroke="#B38728" stroke-width="5" stroke-linecap="round"/>
    <line x1="135" y1="135" x2="138" y2="175" stroke="#B38728" stroke-width="5" stroke-linecap="round"/>
    <line x1="150" y1="135" x2="155" y2="175" stroke="url(#baraatGold)" stroke-width="6" stroke-linecap="round"/>

    <!-- Flowing Tail -->
    <path d="M 160,115 C 180,125 185,150 178,165" stroke="url(#baraatGold)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
